name: V1.5 offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Install locked Python dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r backend/requirements.lock -r backend/requirements-dev.lock
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run offline checks and write Markdown summary
        run: .\.venv\Scripts\python.exe -B tools/check-v15-offline.py
