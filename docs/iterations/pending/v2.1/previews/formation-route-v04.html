7789;font-size:12px;font-weight:600;z-index:1}.step.complete>.dot{background:#e9f6ee;border-color:#aad5ba;color:var(--green)}.step.current>.dot{border:6px solid #dce9ff;background:var(--blue);box-shadow:0 0 0 1px #a4c3f5}.step-head{display:block;text-align:left;width:100%;padding:0 0 0 1px;border-radius:8px}.title-line{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}.step-title{font-size:14px;font-weight:650;line-height:1.65;overflow-wrap:anywhere}.badge{display:inline-flex;flex-shrink:0;align-items:center;gap:4px;border-radius:5px;padding:2px 6px;font-size:10px;line-height:1.6;white-space:nowrap;background:#f0f2f5;color:#657083;font-weight:500}.badge.blue{background:#eaf1ff;color:#245fcb}.badge.green{background:#eaf6ee;color:#187448}.badge.amber{background:#faf1df;color:#805a16}.meta{font-size:11px;line-height:1.65;color:var(--muted);margin-top:4px}.selected>.step-head .step-title{color:var(--blue)}.branch-list{margin:12px 0 0 1px;padding-left:12px;border-left:1px dashed #bac9df}.branch{padding:8px 9px;display:block;text-align:left;border-radius:7px;background:#f7f9fd;width:100%;margin-bottom:6px;border:1px solid #edf1f7}.branch.selected{border-color:#adc7ef;background:#eef4ff}.branch-name{font-size:12px;line-height:1.6;display:flex;gap:6px;align-items:flex-start;justify-content:space-between}.branch-from{font-size:10px;line-height:1.6;color:var(--muted);margin-top:3px}.archive-node{margin:0 0 19px 35px;border:1px dashed #ccd3de;border-radius:9px;background:#fafbfc;padding:10px 11px}.archive-node button{padding:0;display:block;width:100%;text-align:left}.archive-node .step-title{font-size:12px;color:#657083;text-decoration:line-through;text-decoration-thickness:1px}.archive-node.selected{border-color:#7c9fce;background:#f2f6fc}.archive-tip{font-size:10px;line-height:1.6;color:var(--muted);margin-top:4px}.footer{padding:8px 24px 20px;font-size:11px;color:var(--muted);line-height:1.7}.detail{min-width:0}.shell.expanded .detail{padding:23px 26px;background:#fff}.inline-detail{margin-top:14px;margin-left:-24px;border:1px solid var(--line);border-radius:10px;padding:15px;background:#fff}.detail.empty{display:none}.crumb{font-size:11px;color:var(--muted);line-height:1.7;margin-bottom:9px}.crumb button{color:var(--blue);padding:0;text-align:left;font-size:inherit}.detail-title{font-size:17px;line-height:1.6;letter-spacing:-.2px;overflow-wrap:anywhere}.detail-summary{font-size:12px;line-height:1.8;color:#5c697c;margin-top:8px}.tabs{display:flex;gap:19px;margin:18px 0 16px;border-bottom:1px solid var(--line)}.tabs button{padding:0 0 9px;font-size:12px;color:var(--muted);border-bottom:2px solid transparent}.tabs button[aria-selected=true]{border-color:var(--blue);color:var(--blue);font-weight:600}.section-label{font-size:11px;color:var(--muted);margin:17px 0 8px}.section-label:first-child{margin-top:0}.fact{font-size:12px;line-height:1.8;margin:6px 0}.fact-row{border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin:8px 0;background:#fcfdff}.link{color:var(--blue);font-size:12px;padding:0;text-align:left;line-height:1.7}.soft-note{font-size:11px;line-height:1.8;color:var(--muted);background:#f6f8fb;padding:10px 11px;border-radius:7px;margin-top:14px}.event{position:relative;padding:0 0 18px 20px;border-left:1px solid var(--line);margin-left:4px}.event:before{position:absolute;content:"";height:7px;width:7px;border-radius:50%;background:#91a6c5;left:-4px;top:5px}.event:last-child{border-color:transparent}.event-top{display:flex;gap:6px;align-items:center;font-size:11px;flex-wrap:wrap}.event-time{color:var(--muted);margin-left:auto;font-size:10px}.event-name{font-weight:600}.event-desc{font-size:12px;line-height:1.8;margin:5px 0;color:#5c697c}.actor{font-size:10px;border-radius:4px;padding:1px 5px;background:#eef2f7;color:#55647a}dialog{border:1px solid #dbe2ec;border-radius:14px;max-width:600px;width:calc(100% - 32px);padding:0;box-shadow:0 24px 80px #1d2f4d30;color:#182536}dialog::backdrop{background:#18253645}.dialog-head{padding:18px 21px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;align-items:center}.dialog-head h2{font-size:16px}.dialog-body{padding:22px;font-size:13px;line-height:1.9;white-space:pre-wrap}.dialog-footer{padding:0 22px 20px;font-size:11px;color:var(--muted)}.quiet{padding:3px 7px;color:var(--muted);border-radius:5px}.view-status{height:1px;overflow:hidden;position:absolute;clip-path:inset(50%)}@media(max-width:760px){body{padding:15px 10px 40px}.shell.expanded .layout{display:block}.shell.expanded .route{border-right:0}.shell.expanded .detail{padding:0}.intro{align-items:flex-start;flex-direction:column;gap:4px}.head{padding:20px 18px 16px}.toolbar{padding:11px 18px}.route{padding:21px 17px 8px}h1{font-size:19px}.step{padding-left:33px}.shell{border-radius:13px}.demo{font-size:11px}.title-line{gap:6px}.badge{font-size:10px}}

</style></head><body>
<header class="intro"><div class="brand">WALL-E · 文档形成路线</div><div class="demo">交互设计原型 · 示例数据 · 所有操作仅供查看</div></header>
<main id="shell" class="shell" aria-label="文档形成路线原型"><header class="head"><div class="eyebrow">电影推荐小程序 · 需求说明</div><div class="heading"><h1>文档形成路线</h1><button id="expand" class="icon-button" aria-expanded="false">展开视图 ↗</button></div><p class="sub">把需求说明逐步写清楚。节点记录形成过程，文档保存实际成果。</p></header>
<div class="toolbar"><label><input id="show-abandoned" type="checkbox">已放弃节点 <span id="abandoned-count">2</span></label><label><input id="show-branches" type="checkbox" checked>支线</label><button id="locate" class="locate">定位当前步骤</button></div>
<div class="layout"><div id="route" class="route" aria-label="形成步骤"></div><aside id="side-detail" class="detail empty" aria-label="节点详情"></aside></div><p class="footer">查看节点、事件和来源不会切换正在推进的步骤，也不会修改正文。</p></main>
<div id="view-status" class="view-status" role="status" aria-live="polite"></div>
<dialog id="source-dialog"><header class="dialog-head"><h2 id="source-title"></h2><button id="close-dialog" class="quiet" aria-label="关闭来源">✕</button></header><div id="source-body" class="dialog-body"></div><div class="dialog-footer">示例来源快照，不连接真实消息或文档。</div></dialog>
<script>
const sources={
 goal:{title:'触发消息 · 11月7日 10:02',body:'你：我想把电影推荐小程序的首版需求写清楚，先给我一条形成路径。\n\n这条消息引出了“明确目标与范围”步骤。'},
 finish1:{title:'结束操作 · 11月7日 10:26',body:'你选择了“结束本步骤并继续”。\n\n当时依据：目标与范围已写入需求说明 V2；首版个人使用、不做社交。\n结果：本步骤完成，开始“形成推荐与反馈流程”。'},
 current:{title:'开始事件 · 11月7日 10:26',body:'由“明确目标与范围”的结束并继续操作触发。\n\n原步骤：已完成。\n新步骤：形成推荐与反馈流程，进行中。\n此事件没有修改文档正文。'},
 friend:{title:'支线触发消息 · 11月7日 10:42',body:'你：要不要让好友帮忙推荐？\n\n当时正在推进：形成推荐与反馈流程。\nAI将其记录为支线，说明它可能扩大首版个人使用的范围；尚未决定是否纳入。'},
 score:{title:'暂缓操作 · 11月7日 10:17',body:'你：评分细节先放一放，先确定推荐的目标。\n\n“评分方式”的支线保留为暂缓；它没有被解决，也没有被放弃。'},
 abandon1:{title:'放弃事件 · 11月7日 10:21',body:'你明确决定：首版先不做好友关系，保持个人使用。\n\n原节点“建立好友关系”的规划被放弃。\n已经发生的讨论和来源保留；没有删除或回退文档内容。'},
 abandon2:{title:'放弃事件 · 11月7日 10:24',body:'你明确决定：不做公开排行榜，不以社交排名作为推荐目标。\n\n原“设计公开排行榜”节点被放弃，后续路线改为个人推荐与反馈。'},
 v2:{title:'文档成果 · 需求说明 V2',body:'# 目标与范围\n\n面向个人使用，以提高推荐准确性为首要目标。记录和评分用于支持推荐。首版暂不包含社交功能。\n\n这是已保存版本的示例内容；写入事件与步骤结束事件分别记录。'},
 v4:{title:'文档成果 · 需求说明 V4',body:'# 推荐与反馈流程\n\n系统提供推荐并说明理由；用户可以记录观看和评分，并反馈推荐不准确的原因。\n\n当前仍待讨论：冷启动信息不足时如何处理，以及好友推荐是否影响范围。'},
 plan:{title:'规划来源 · 11月7日 10:04',body:'AI依据文档用途建立初始路径：目标与范围 → 推荐反馈流程 → 异常与边界 → 全文核对。\n\n这是规划记录，不代表用户已经确认全部方案，也不代表这些内容已写入。'}
};
const event=(name,actor,time,desc,source)=>({name,actor,time,desc,source});
const nodes=[
 {id:'s1',kind:'step',num:'1',title:'明确目标与首版范围',status:'已完成',tone:'green',summary:'形成可用于设计的目标、使用对象和首版边界。',meta:'你结束本步骤 · 成果见 V2',facts:['预期成果：首版解决什么问题、面向谁、哪些内容暂不包含。','完成依据：个人使用与准确性目标已写入；社交方向明确排除。'],content:'v2',source:'goal',events:[event('步骤完成','你','10:26','你结束本步骤，并开始形成推荐与反馈流程。','finish1'),event('阶段内容已写入','系统','10:23','目标与范围保存为 V2；这次写入本身没有完成步骤。','v2'),event('步骤创建并开始','AI','10:04','根据文档用途建立路径，开始形成目标与范围。','goal')]},
 {id:'s2',kind:'step',num:'2',title:'形成推荐与反馈流程',status:'进行中',tone:'blue',summary:'明确从推荐到反馈的一条连贯业务过程。',meta:'由上一步“结束并继续”触发',facts:['已落地：正常推荐与反馈流程，见需求说明 V4。','待处理：冷启动信息不足时的策略。','当前正在探索支线：好友是否参与推荐。'],content:'v4',source:'current',events:[event('产生好友推荐支线','AI','10:43','将你提出的问题关联到本步骤，正文保持不变。','friend'),event('反馈规则已写入','系统','10:36','你确认后保存为 V4；本步骤仍然进行中。','v4'),event('步骤开始','你','10:26','由上一步的结束并继续操作触发。','current')]},
 {id:'s3',kind:'step',num:'3',title:'补齐异常情况与边界',status:'未开始',tone:'',summary:'检查数据不足、无可用推荐和反馈失败等情况。',meta:'规划来自初始路径 · 尚无开始事件',facts:['预期成果：主要异常情况及对应处理规则。','当前仅有规划，还没有实际推进记录。'],source:'plan',events:[event('加入形成路径','AI','10:04','规划在核心流程之后检查异常与边界。','plan')]},
 {id:'s4',kind:'step',num:'4',title:'核对全文与遗留问题',status:'未开始',tone:'',summary:'检查内容是否一致、缺口是否明确，判断这份文档是否足以使用。',meta:'规划来自初始路径 · 尚无开始事件',facts:['预期成果：全文核对结果与明确的遗留事项。','本步骤完成不等于自动确认整份文档。'],source:'plan',events:[event('加入形成路径','AI','10:04','文档形成过程中持续写入，最后集中核对。','plan')]}
];
const branches=[
 {id:'b1',kind:'branch',parent:'s2',title:'好友是否参与推荐',status:'讨论中',tone:'blue',summary:'这可能扩大首版个人使用的范围；先探讨必要性，再决定是否纳入。',meta:'来自 ② 推荐与反馈流程',facts:['来源步骤：形成推荐与反馈流程。','产生原因：你在讨论推荐流程时提出好友参与的问题。','返回位置：形成推荐与反馈流程；尚无收束事件。'],source:'friend',events:[event('支线产生并进入讨论','AI','10:43','由你的问题引出，关联到本步骤；未修改文档范围。','friend')]},
 {id:'b2',kind:'branch',parent:'s1',title:'评分方式',status:'已暂缓',tone:'amber',summary:'评分的具体形式暂留后续，当前先明确推荐目标。',meta:'来自 ① 目标与首版范围',facts:['这条支线仍然保留，暂缓不代表已解决。','暂缓由你明确提出，相关讨论仍可追溯。'],source:'score',events:[event('支线暂缓','你','10:17','先确定推荐目标，评分形式以后继续。','score'),event('讨论中引出评分问题','AI','10:13','从偏好表达的方式引出。','goal')]}
];
const abandoned=[
 {id:'x1',kind:'abandoned',after:'s1',title:'建立好友关系',status:'已放弃',tone:'',summary:'首版决定保持个人使用，不纳入好友关系。',meta:'你明确放弃 · 原位于目标范围之后',facts:['放弃原因：保持首版个人使用范围。','历史位置：目标与范围之后、形成推荐流程之前。','后续路线：转向个人推荐与反馈流程。'],source:'abandon1',replacement:'s2',events:[event('节点被放弃','你','10:21','明确首版不做好友关系；保留原讨论和规划历史。','abandon1'),event('曾加入候选路径','AI','10:12','讨论社交方向时形成的规划。','goal')]},
 {id:'x2',kind:'abandoned',after:'s2',title:'设计公开排行榜',status:'已放弃',tone:'',summary:'用户明确不采用公开排名作为首版方向。',meta:'你明确放弃 · 原社交方向的节点',facts:['放弃原因：当前关注个人推荐准确性，不做社交排名。','放弃节点未计入当前剩余路线。','曾形成的内容不会因放弃节点自动被删除。'],source:'abandon2',replacement:'s2',events:[event('节点被放弃','你','10:24','明确排除公开排行榜，保留历史。','abandon2')]}
];
const all=[...nodes,...branches,...abandoned];let selected='s2',tab='overview',wide=false;const shell=document.getElementById('shell'),route=document.getElementById('route'),side=document.getElementById('side-detail');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=n=>`<span class="badge ${n.tone}">${n.id==='s2'?'● ':''}${esc(n.status)}</span>`;
function detail(n){const parent=n.parent?nodes.find(x=>x.id===n.parent):null;let body='';if(tab==='events'){body=n.events.map(e=>`<div class="event"><div class="event-top"><span class="event-name">${esc(e.name)}</span><span class="actor">${esc(e.actor)}</span><span class="event-time">11月7日 ${esc(e.time)}</span></div><p class="event-desc">${esc(e.desc)}</p><button class="link" data-source="${e.source}">查看${e.name.includes('写入')?'文档版本':'触发来源'} →</button></div>`).join('');}else if(tab==='content'){body=n.content?`<div class="fact-row"><p class="fact">已保存的关联成果</p><button class="link" data-source="${n.content}">${n.content==='v2'?'目标与范围 · V2':'推荐与反馈流程 · V4'} →</button></div><p class="soft-note">内容已写入与节点已完成分别记录。这里展示关联成果，不用模型回复推断保存成功。</p>`:`<p class="fact">${n.kind==='branch'?'这条支线尚未形成独立的正文写入记录。':n.kind==='abandoned'?'没有因放弃此节点而删除或回退文档。':'尚无本步骤的正文写入记录。'}</p>`;}else{body=`<div class="section-label">${n.kind==='branch'?'来源与返回':'当前情况'}</div>${n.facts.map(f=>`<p class="fact">${esc(f)}</p>`).join('')}<div class="section-label">触发依据</div><button class="link" data-source="${n.source}">${n.kind==='branch'?'查看引出支线的原消息':n.kind==='abandoned'?'查看放弃原因与操作':'查看创建或开始依据'} →</button>${parent?`<div class="fact-row"><div class="section-label">来自节点</div><button class="link" data-select="${parent.id}">${esc(parent.title)} →</button></div>`:''}${n.replacement?`<div class="fact-row"><div class="section-label">调整后的路线</div><button class="link" data-select="${n.replacement}">查看个人推荐与反馈流程 →</button></div>`:''}${n.kind==='abandoned'?'<p class="soft-note">已放弃节点保留历史。重新采用应建立新的规划并关联旧节点，不把原记录直接改回“未开始”。</p>':''}`;}
return `<div class="detail-content" data-detail-id="${n.id}"><div class="crumb">${parent?`<button data-select="${parent.id}">${esc(parent.title)}</button> ／ 支线`:n.kind==='abandoned'?'历史规划 ／ 已放弃节点':'文档形成路线 ／ 节点详情'}</div><div class="title-line"><h2 class="detail-title">${esc(n.title)}</h2>${badge(n)}</div><p class="detail-summary">${esc(n.summary)}</p><div class="tabs" role="tablist" aria-label="节点信息">${[['overview','概览'],['events','事件记录'],['content','关联内容']].map(([k,label])=>`<button id="${n.id}-tab-${k}" role="tab" aria-controls="${n.id}-tabpanel" tabindex="${tab===k?0:-1}" aria-selected="${tab===k}" data-tab="${k}">${label}</button>`).join('')}</div><div id="${n.id}-tabpanel" role="tabpanel" aria-labelledby="${n.id}-tab-${tab}" aria-label="${tab==='events'?'事件记录':tab==='content'?'关联内容':'节点概览'}">${body}</div></div>`;}
function render(focus){const expanded=wide&&innerWidth>760;const showA=document.getElementById('show-abandoned').checked,showB=document.getElementById('show-branches').checked;shell.classList.toggle('expanded',wide);document.getElementById('expand').textContent=wide?'收起视图 ↙':'展开视图 ↗';document.getElementById('expand').setAttribute('aria-expanded',String(wide));let html='';for(const n of nodes){html+=`<section class="step ${n.id==='s1'?'complete':''} ${n.id==='s2'?'current':''} ${selected===n.id?'selected':''}" data-step="${n.id}"><span class="dot" aria-hidden="true">${n.id==='s1'?'✓':n.id==='s2'?'':n.num}</span><button class="step-head" data-select="${n.id}" aria-expanded="${selected===n.id}" ${n.id==='s2'?'aria-current="step"':''}><span class="title-line"><span class="step-title">${n.num} · ${esc(n.title)}</span>${badge(n)}</span><span class="meta">${esc(n.meta)}</span></button>`;
if(showB){html+=`<div class="branch-list" aria-label="${esc(n.title)}的支线">${branches.filter(b=>b.parent===n.id).map(b=>`<button class="branch ${selected===b.id?'selected':''}" data-select="${b.id}" aria-expanded="${selected===b.id}"><span class="branch-name"><span>↳ ${esc(b.title)}</span>${badge(b)}</span><span class="branch-from">${esc(b.meta)}</span></button>${selected===b.id&&!expanded?`<div class="inline-detail">${detail(b)}</div>`:''}`).join('')}</div>`;}
if(selected===n.id&&!expanded)html+=`<div class="inline-detail">${detail(n)}</div>`;html+='</section>';
if(showA){for(const a of abandoned.filter(a=>a.after===n.id)){html+=`<section class="archive-node ${selected===a.id?'selected':''}" data-archive="${a.id}"><button data-select="${a.id}" aria-expanded="${selected===a.id}"><span class="title-line"><span class="step-title">${esc(a.title)}</span>${badge(a)}</span><span class="archive-tip">${esc(a.meta)} · 查看原因 →</span></button>${selected===a.id&&!expanded?`<div class="inline-detail" style="margin-left:0">${detail(a)}</div>`:''}</section>`;}}
}route.innerHTML=html;side.classList.toggle('empty',!expanded);side.innerHTML=expanded?detail(all.find(x=>x.id===selected)):'';shell.dataset.selected=selected;shell.dataset.activeTab=tab;if(focus)document.querySelector(focus)?.focus({preventScroll:true});}
function choose(id){if(!all.some(n=>n.id===id))return;if(abandoned.some(n=>n.id===id))document.getElementById('show-abandoned').checked=true;if(branches.some(n=>n.id===id))document.getElementById('show-branches').checked=true;selected=id;tab='overview';render(`[data-select="${id}"]`);document.getElementById('view-status').textContent='正在查看：'+all.find(n=>n.id===id).title+'。当前推进步骤仍为形成推荐与反馈流程。';}
document.addEventListener('click',e=>{const a=e.target.closest('[data-select]');if(a){choose(a.dataset.select);return}const b=e.target.closest('button[data-tab]');if(b){tab=b.dataset.tab;render(`[data-tab="${tab}"]`);return}const c=e.target.closest('[data-source]');if(c){const s=sources[c.dataset.source];document.getElementById('source-title').textContent=s.title;document.getElementById('source-body').textContent=s.body;document.getElementById('source-dialog').showModal();}});
document.addEventListener('keydown',e=>{const button=e.target.closest('button[role="tab"]');if(!button||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const keys=['overview','events','content'];let i=keys.indexOf(tab);i=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3;tab=keys[i];render('[data-tab="'+tab+'"]')});
document.getElementById('expand').onclick=()=>{wide=!wide;render('#expand')};document.getElementById('locate').onclick=()=>{choose('s2');document.querySelector('[data-step="s2"]').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'})};document.getElementById('show-abandoned').onchange=()=>{if(!document.getElementById('show-abandoned').checked&&abandoned.some(n=>n.id===selected)){selected='s2';tab='overview'}render('#show-abandoned')};document.getElementById('show-branches').onchange=()=>{if(!document.getElementById('show-branches').checked){const b=branches.find(n=>n.id===selected);if(b){selected=b.parent;tab='overview'}}render('#show-branches')};document.getElementById('close-dialog').onclick=()=>document.getElementById('source-dialog').close();let lastNarrow=innerWidth<=760;addEventListener('resize',()=>{const narrow=innerWidth<=760;if(narrow!==lastNarrow){lastNarrow=narrow;render()}});render();document.body.dataset.prototypeReady='true';
</script></body></html>
